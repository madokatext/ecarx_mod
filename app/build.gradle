plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.madokatext.ecarxmod'
    compileSdk 35
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'io.github.madokatext.ecarxmod'
        minSdk 28
        targetSdk 28
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // API 82 supplies the legacy Java declarations; LSPosed API 93 supplies them at runtime.
    compileOnly 'de.robv.android.xposed:api:82'
}
