name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: Assemble Android 9 module
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK and build tools
        run: sdkmanager "platforms;android-28" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble installable APK
        # Deliberately compile/package only: no test, connectedCheck, lint, or build task.
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare download
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ecarx-mod-1.5.2-${COMMIT_SHA:0:7}.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ecarx-mod-apk-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
